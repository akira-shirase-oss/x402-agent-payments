[package]
name = "xpay-db"
description = "PostgreSQL: the bounded pool, owner and runtime roles, the protections manifest, binary/schema compatibility, fingerprints."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# TestDb (one throwaway database per test) and the log-capture check.
test-support = ["dep:tracing-subscriber", "dep:uuid"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
xpay-db = { path = ".", features = ["test-support"] }

[lints]
workspace = true
