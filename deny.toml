# Supply-chain policy, checked by cargo-deny in scripts/check.sh and CI (daily as well, so a
# new advisory fails the build without a push).

[graph]
all-features = true

[advisories]
# Vulnerabilities and unmaintained crates fail by default. Ignore only with a reason and an expiry.
ignore = [
  # crypto-bigint 0.5.5, through k256 0.13 / elliptic-curve 0.13 (alloy's secp256k1): the
  # fix exists only in 0.7.6, which no alloy release uses yet. Exposure (D-016): the seller
  # and the mock only recover public signatures; the buyer signs with its own key on its own
  # machine, so the leak needs a co-located observer. Remove when alloy moves to k256 0.14.
  # paste 1.0.15 (alloy's macros): unmaintained, no vulnerability; a proc-macro, so it runs
  # at build time only and ships no code into the binaries.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time proc-macro under alloy; no vulnerability (see D-016)" },
  { id = "RUSTSEC-2026-0387", reason = "no fixed crypto-bigint 0.5; only reachable through alloy's k256 0.13 (see D-016)" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "CDLA-Permissive-2.0", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    { crate = "openssl", reason = "one TLS stack: rustls (the database client; the service is behind Caddy)" },
    { crate = "openssl-sys", reason = "one TLS stack: rustls (the database client; the service is behind Caddy)" },
    { crate = "async-std", reason = "one async runtime: tokio" },
]
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
