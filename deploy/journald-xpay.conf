# Bounded log retention (docs/OPERATIONS.md, "Observability"). Install as
# /etc/systemd/journald.conf.d/xpay.conf, then `systemctl restart systemd-journald`.
# The service logs one JSON object per line to stdout; journald keeps it, never past these.
[Journal]
Storage=persistent
SystemMaxUse=512M
SystemKeepFree=1G
MaxRetentionSec=30day
RateLimitIntervalSec=30s
RateLimitBurst=10000
